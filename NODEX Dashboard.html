  if (n >= 1e6) return `R$${(n / 1e6).toFixed(1)}M`;

};

/* ─── CONFETTI ──────────────────────────────── */
function launchConfetti() {
  const canvas = document.getElementById('confetti-canvas');
  const ctx = canvas.getContext('2d');
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
  const pieces = Array.from({ length: 160 }, () => ({
    x: Math.random() * canvas.width,
    y: -20 - Math.random() * 200,
    w: 6 + Math.random() * 8,
    h: 10 + Math.random() * 6,
    r: Math.random() * Math.PI * 2,
    rv: (Math.random() - 0.5) * 0.15,
    vx: (Math.random() - 0.5) * 3,
    vy: 2 + Math.random() * 4,
    color: ['#7B1226', '#C8294A', '#F0EDE8', '#FFD700', '#FF6B6B', '#9E1A33'][Math.floor(Math.random() * 6)],
    alpha: 1
  }));
  let frame = 0;
  const tick = () => {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    pieces.forEach((p) => {
      p.x += p.vx; p.y += p.vy; p.r += p.rv; p.vy += 0.04;
      if (frame > 120) p.alpha -= 0.01;
      ctx.save(); ctx.globalAlpha = Math.max(0, p.alpha);
      ctx.translate(p.x, p.y); ctx.rotate(p.r);
      ctx.fillStyle = p.color;
      ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
      ctx.restore();
    });
    frame++;
    if (frame < 220 && pieces.some((p) => p.alpha > 0)) requestAnimationFrame(tick);
    else ctx.clearRect(0, 0, canvas.width, canvas.height);
  };
  requestAnimationFrame(tick);
}

/* ─── SHADER BACKGROUND ─────────────────────── */
function ShaderBackground() {
  const containerRef = useRef(null);
  useEffect(() => {
    if (!containerRef.current || !window.THREE) return;
    const THREE = window.THREE;
    const container = containerRef.current;

    const vertexShader = `void main() { gl_Position = vec4(position, 1.0); }`;
    const fragmentShader = `
      #define TWO_PI 6.2831853072
      precision highp float;
      uniform vec2 resolution;
      uniform float time;
      void main(void) {
        vec2 uv = (gl_FragCoord.xy * 2.0 - resolution.xy) / min(resolution.x, resolution.y);
        float t = time * 0.04;
        float lw = 0.0025;
        float r = 0.0; float g = 0.0; float b = 0.0;
        for(int i = 0; i < 6; i++){
          float fi = float(i);
          r += lw * fi * fi / abs(fract(t - 0.008*fi)*6.0 - length(uv) + mod(uv.x+uv.y, 0.22));
          g += lw * 0.3 / abs(fract(t - 0.01 + 0.009*fi)*5.5 - length(uv) + mod(uv.x-uv.y, 0.18));
          b += lw * 0.15 / abs(fract(t + 0.012*fi)*6.5 - length(uv) + mod(uv.x*uv.y, 0.2));
        }
        // Wine-tinted: boost red, suppress green/blue
        gl_FragColor = vec4(r * 1.2, g * 0.15, b * 0.1, 1.0);
      }
    `;

    const camera = new THREE.Camera();
    camera.position.z = 1;
    const scene = new THREE.Scene();
    const geometry = new THREE.PlaneGeometry(2, 2);
    const uniforms = {
      time: { value: 1.0 },
      resolution: { value: new THREE.Vector2() }
    };
    const material = new THREE.ShaderMaterial({ uniforms, vertexShader, fragmentShader });
    scene.add(new THREE.Mesh(geometry, material));

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(window.devicePixelRatio);
    container.appendChild(renderer.domElement);

    let animId;
    const resize = () => {
      const w = container.clientWidth, h = container.clientHeight;
      renderer.setSize(w, h);
      uniforms.resolution.value.set(renderer.domElement.width, renderer.domElement.height);
    };
    resize();
    window.addEventListener('resize', resize);

    const animate = () => {
      animId = requestAnimationFrame(animate);
      uniforms.time.value += 0.05;
      renderer.render(scene, camera);
    };
    animate();

    return () => {
      cancelAnimationFrame(animId);
      window.removeEventListener('resize', resize);
      if (container.contains(renderer.domElement)) container.removeChild(renderer.domElement);
      renderer.dispose(); geometry.dispose(); material.dispose();
    };
  }, []);

  return <div ref={containerRef} style={{ position: 'absolute', inset: 0, zIndex: 0 }} />;
}

/* ─── GOAL BAR ──────────────────────────────── */
function GoalBar({ total, isMobile }) {
  const currentGoalIdx = GOALS.findIndex((g) => total < g);
  const isMaxed = currentGoalIdx === -1;
  const nextGoal = isMaxed ? GOALS[GOALS.length - 1] : GOALS[currentGoalIdx];
  const prevGoal = currentGoalIdx <= 0 ? 0 : GOALS[currentGoalIdx - 1];
  const progress = isMaxed ? 100 : Math.min(100, (total - prevGoal) / (nextGoal - prevGoal) * 100);

  return (
    <div style={{
      background: BG3, border: `1px solid ${BORDER}`,
      borderRadius: 12, padding: '14px 20px',
      display: 'flex', alignItems: 'center', gap: 16,
      width: isMobile ? '100%' : undefined, minWidth: isMobile ? 0 : 320
    }}>
      <Icon name="trophy" size={18} color={WINE} />
      <div style={{ flex: 1 }}>
        <div style={{ display: 'flex', justifyContent: 'space-between', fontSize: 11, color: MUTED, marginBottom: 6, letterSpacing: '0.04em' }}>
          <span>META</span>
          <span style={{ color: TEXT, fontWeight: 600, fontFamily: 'sans-serif' }}>{fmtShort(nextGoal)}</span>
        </div>
        <div style={{ height: 6, background: BORDER, borderRadius: 3, overflow: 'hidden' }}>
          <div style={{
            height: '100%', borderRadius: 3,
            background: `linear-gradient(90deg, ${WINE}, ${WINE_LIGHT})`,
            width: `${progress}%`, transition: 'width 0.8s ease',
            boxShadow: `0 0 8px ${WINE}88`
          }} />
        </div>
        <div style={{ fontSize: 11, color: MUTED, marginTop: 4, fontFamily: 'sans-serif' }}>
          {fmt(total)} <span style={{ color: WINE }}>↑</span> {fmtShort(nextGoal)}
        </div>
      </div>
    </div>
  );
}

/* ─── REVENUE CHART ─────────────────────────── */
function RevenueChart({ services, cashEntries, dateFrom, dateTo, isMobile }) {
  const chartRef = useRef(null);
  const chartInstance = useRef(null);
  const [granularity, setGranularity] = useState('day');

  const data = useMemo(() => {
    const from = dateFrom ? new Date(dateFrom + 'T00:00:00') : new Date('2020-01-01');
    const to = dateTo ? new Date(dateTo + 'T23:59:59') : new Date('2099-01-01');

    const filtered = services
      .filter((s) => s.status === 'Concluído' && s.date)
      .filter((s) => { const d = new Date(s.date + 'T00:00:00'); return d >= from && d <= to; });

    const getKey = (dateStr) => {
      const d = new Date(dateStr + 'T00:00:00');
      if (granularity === 'day') return dateStr;
      if (granularity === 'week') {
        const day = d.getDay(); const diff = d.getDate() - day + (day === 0 ? -6 : 1);
        const mon = new Date(d); mon.setDate(diff);
        return mon.toISOString().slice(0, 10);
      }
      return dateStr.slice(0, 7);
    };

    const map = {};
    filtered.forEach((s) => {
      const k = getKey(s.date);
      map[k] = (map[k] || 0) + s.value;
    });

    const keys = Object.keys(map).sort();
    const labels = keys.map((k) => {
      if (granularity === 'month') {
        const [y, m] = k.split('-');
        return new Date(+y, +m - 1).toLocaleDateString('pt-BR', { month: 'short', year: '2-digit' });
      }
      if (granularity === 'week') return `Sem. ${new Date(k + 'T00:00:00').toLocaleDateString('pt-BR', { day: '2-digit', month: 'short' })}`;
      return new Date(k + 'T00:00:00').toLocaleDateString('pt-BR', { day: '2-digit', month: 'short' });
    });

    return { labels, values: keys.map((k) => map[k]) };
  }, [services, dateFrom, dateTo, granularity]);

  useEffect(() => {
    if (!chartRef.current) return;
    if (chartInstance.current) chartInstance.current.destroy();

    chartInstance.current = new Chart(chartRef.current, {
      type: 'line',
      data: {
        labels: data.labels,
        datasets: [{
          label: 'Faturamento',
          data: data.values,
          borderColor: WINE,
          borderWidth: 2.5,
          pointBackgroundColor: WINE,
          pointBorderColor: '#0A0A0A',
          pointBorderWidth: 2,
          pointRadius: 5,
          pointHoverRadius: 7,
          fill: true,
          backgroundColor: function(ctx) {
            const chart = ctx.chart;
            const { ctx: c, chartArea } = chart;
            if (!chartArea) return WINE + '00';
            const gradient = c.createLinearGradient(0, chartArea.top, 0, chartArea.bottom);
            gradient.addColorStop(0, WINE + '55');
            gradient.addColorStop(1, WINE + '00');
            return gradient;
          },
          tension: 0.4
        }]
      },
      options: {
        responsive: true, maintainAspectRatio: false,
        plugins: {
          legend: { display: false },
          tooltip: {
            backgroundColor: BG3,
            borderColor: BORDER, borderWidth: 1,
            titleColor: MUTED, bodyColor: TEXT,
            callbacks: { label: (ctx) => fmt(ctx.raw) }
          }
        },
        scales: {
          x: { grid: { color: BORDER }, ticks: { color: MUTED, font: { family: 'Syne' } } },
          y: { grid: { color: BORDER + '88' }, ticks: { color: MUTED, font: { family: 'Syne' }, callback: (v) => fmtShort(v) } }
        }
      }
    });
  }, [data]);

  const granOpts = [{ v: 'day', l: 'Dia' }, { v: 'week', l: 'Semana' }, { v: 'month', l: 'Mês' }];

  return (
    <div style={{ background: BG3, border: `1px solid ${BORDER}`, borderRadius: 14, padding: 28, marginTop: 24 }}>
      <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 24 }}>
        <div style={{ fontWeight: 700, fontSize: 15 }}>Faturamento</div>
        <div style={{ display: 'flex', gap: 4, background: BG2, borderRadius: 8, padding: 3 }}>
          {granOpts.map((o) =>
            <button key={o.v} onClick={() => setGranularity(o.v)} style={{
              ...btnBase, background: granularity === o.v ? WINE : 'transparent',
              color: granularity === o.v ? TEXT : MUTED, padding: '6px 14px', fontSize: 12
            }}>{o.l}</button>
          )}
        </div>
      </div>
      <div style={{ height: 260 }}>
        {data.labels.length === 0
          ? <div style={{ height: '100%', display: 'flex', alignItems: 'center', justifyContent: 'center', color: MUTED, fontSize: 13 }}>Sem dados para exibir</div>
          : <canvas ref={chartRef} />
        }
      </div>
    </div>
  );
}

/* ─── DASHBOARD SECTION ─────────────────────── */
function DashboardSection({ services, cashEntries, isMobile }) {
  const today = new Date().toISOString().slice(0, 10);
  const [dateFrom, setDateFrom] = useState('');
  const [dateTo, setDateTo] = useState(today);
  const [toast, setToast] = useState(null);
  const prevGoalRef = useRef(load('nodex_last_goal', -1));

  const totalBruto = services.reduce((s, x) => s + x.value, 0);

  useEffect(() => {
    const currentGoalIdx = GOALS.findIndex((g) => totalBruto < g);
    const achieved = currentGoalIdx <= 0 ? 0 : GOALS[currentGoalIdx - 1];
    const prev = prevGoalRef.current;
    if (achieved > prev && achieved > 0) {
      save('nodex_last_goal', achieved);
      prevGoalRef.current = achieved;
      setTimeout(() => {
        launchConfetti();
        setToast({ msg: `🎉 Meta de ${fmtShort(achieved)} atingida!`, sub: 'Parabéns pelo crescimento!' });
        setTimeout(() => setToast(null), 4000);
      }, 300);
    }
  }, [totalBruto]);

  const inRange = (s) => {
    if (!s.date) return true;
    const d = new Date(s.date + 'T00:00:00');
    if (dateFrom && d < new Date(dateFrom + 'T00:00:00')) return false;
    if (dateTo && d > new Date(dateTo + 'T23:59:59')) return false;
    return true;
  };

  const filteredSvcs = services.filter(inRange);
  const bruto = filteredSvcs.reduce((s, x) => s + x.value, 0);

  const inRangeCash = (c) => {
    if (!c.date) return true;
    const d = new Date(c.date + 'T00:00:00');
    if (dateFrom && d < new Date(dateFrom + 'T00:00:00')) return false;
    if (dateTo && d > new Date(dateTo + 'T23:59:59')) return false;
    return true;
  };

  const filteredCash = cashEntries.filter(inRangeCash);
  const despesas = filteredCash.filter((c) => c.type === 'Saída').reduce((s, x) => s + x.value, 0);
  const liquido = bruto - despesas;
  const entradas = filteredCash.filter((c) => c.type === 'Entrada').reduce((s, x) => s + x.value, 0);
  const lucro = entradas - despesas;

  const concluidos = filteredSvcs.filter((s) => s.status === 'Concluído').length;
  const pendentes = filteredSvcs.filter((s) => s.status === 'Em andamento').length;
  const afazer = filteredSvcs.filter((s) => s.status === 'A fazer').length;

  return (
    <div>
      {/* Header row */}
      <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: isMobile ? 'flex-start' : 'center', flexDirection: isMobile ? 'column' : 'row', gap: 16, marginBottom: 28 }}>
        <div>
          <div style={{ fontSize: isMobile ? 20 : 24, fontWeight: 800, letterSpacing: '-0.02em' }}>Dashboard</div>
          <div style={{ color: MUTED, fontSize: 13, marginTop: 4 }}>Visão geral do negócio</div>
        </div>
        <GoalBar total={totalBruto} isMobile={isMobile} />
      </div>

      {/* Date filter */}
      <div style={{ display: 'flex', alignItems: 'center', gap: 8, marginBottom: 24, flexWrap: 'wrap' }}>
        <span style={{ fontSize: 12, color: MUTED, letterSpacing: '0.06em', textTransform: 'uppercase' }}>Período:</span>
        <input type="date" value={dateFrom} onChange={(e) => setDateFrom(e.target.value)}
          style={{ ...inputStyle, width: isMobile ? '100%' : 160, flex: isMobile ? '1 1 140px' : undefined }}
          onFocus={(e) => e.target.style.borderColor = WINE}
          onBlur={(e) => e.target.style.borderColor = BORDER} />
        <span style={{ color: MUTED }}>→</span>
        <input type="date" value={dateTo} onChange={(e) => setDateTo(e.target.value)}
          style={{ ...inputStyle, width: isMobile ? '100%' : 160, flex: isMobile ? '1 1 140px' : undefined }}
          onFocus={(e) => e.target.style.borderColor = WINE}
          onBlur={(e) => e.target.style.borderColor = BORDER} />
        {(dateFrom || dateTo !== today) &&
          <Btn variant="ghost" small onClick={() => { setDateFrom(''); setDateTo(today); }}>Limpar</Btn>
        }
      </div>

      {/* Metric cards */}
      <div style={{ display: 'grid', gridTemplateColumns: isMobile ? 'repeat(2, 1fr)' : 'repeat(3, 1fr)', gap: 12, marginBottom: 0 }}>
        <MetricCard label="Faturamento Bruto" value={fmt(bruto)} sub="Serviços no período" accent={WINE} />
        <MetricCard label="Faturamento Líquido" value={fmt(liquido)} sub="Bruto - despesas" accent="#4A90D9" />
        <MetricCard label="Lucro" value={fmt(lucro)} sub="Entradas - saídas" accent="#4CAF82" />
        <MetricCard label="Concluídos" value={concluidos} sub="Serviços" accent="#4CAF82" />
        <MetricCard label="Em Andamento" value={pendentes} sub="Serviços" accent="#F5A623" />
        <MetricCard label="A Fazer" value={afazer} sub="Serviços" accent="#4A90D9" />
      </div>

      <RevenueChart services={services} cashEntries={cashEntries} dateFrom={dateFrom} dateTo={dateTo} isMobile={isMobile} />

      {/* Toast */}
      {toast &&
        <div style={{
          position: 'fixed', bottom: 24, right: isMobile ? 16 : 32, left: isMobile ? 16 : 'auto', zIndex: 9000,
          background: BG3, border: `1px solid ${WINE}66`,
          borderRadius: 14, padding: '18px 28px',
          boxShadow: `0 24px 48px rgba(0,0,0,0.7), 0 0 0 1px ${WINE}33`,
          animation: 'slideUp 0.3s ease'
        }}>
          <div style={{ fontSize: 16, fontWeight: 700 }}>{toast.msg}</div>
          <div style={{ fontSize: 13, color: MUTED, marginTop: 4 }}>{toast.sub}</div>
        </div>
      }
    </div>
  );
}

/* ─── SERVICES SECTION ──────────────────────── */
function ServicesSection({ services, setServices, isMobile }) {
  const [modal, setModal] = useState(null);
  const [form, setForm] = useState({ empresa: '', descricao: '', value: '', status: 'A fazer', date: '' });
  const [search, setSearch] = useState('');

  const openNew = () => {
    setForm({ empresa: '', descricao: '', value: '', status: 'A fazer', date: new Date().toISOString().slice(0, 10) });
    setModal('new');
  };

  const openEdit = (s) => {
    setForm({ empresa: s.empresa, descricao: s.descricao, value: String(s.value), status: s.status, date: s.date || '' });
    setModal(s.id);
  };

  const save_ = () => {
    if (!form.empresa.trim() || !form.value) return;
    const newSvc = {
      id: modal === 'new' ? Date.now() : modal,
      empresa: form.empresa.trim(),
      descricao: form.descricao.trim(),
      value: parseFloat(form.value) || 0,
      status: form.status,
      date: form.date

    setServices(modal === 'new' ? [newSvc, ...services] : services.map((s) => s.id === modal ? newSvc : s));
    setModal(null);
  };

  const del = (id) => { if (confirm('Excluir serviço?')) setServices(services.filter((s) => s.id !== id)); };

  const filtered = services.filter((s) =>
    !search || s.empresa.toLowerCase().includes(search.toLowerCase()) || s.descricao.toLowerCase().includes(search.toLowerCase())
  );

  return (
    <div>
      <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: isMobile ? 'flex-start' : 'center', flexDirection: isMobile ? 'column' : 'row', gap: 12, marginBottom: 24 }}>
        <div>
          <div style={{ fontSize: isMobile ? 20 : 24, fontWeight: 800, letterSpacing: '-0.02em' }}>Serviços</div>
          <div style={{ color: MUTED, fontSize: 13, marginTop: 4 }}>{services.length} serviços cadastrados</div>
        </div>
        <Btn onClick={openNew}><Icon name="plus" size={14} /> Novo Serviço</Btn>
      </div>

      <input
        placeholder="Buscar empresa ou descrição..."
        value={search} onChange={(e) => setSearch(e.target.value)}
        style={{ ...inputStyle, maxWidth: 340, marginBottom: 20 }}
        onFocus={(e) => e.target.style.borderColor = WINE}
        onBlur={(e) => e.target.style.borderColor = BORDER} />

      <div style={{ background: BG3, border: `1px solid ${BORDER}`, borderRadius: 14, overflowX: 'auto' }}>
        <table style={{ width: '100%', borderCollapse: 'collapse', minWidth: 560 }}>
          <thead>
            <tr style={{ borderBottom: `1px solid ${BORDER}` }}>
              {['Empresa', 'Descrição', 'Valor', 'Status', 'Data', ''].map((h) =>
                <th key={h} style={{ padding: '14px 20px', textAlign: 'left', fontSize: 11, fontWeight: 600, letterSpacing: '0.08em', color: MUTED, textTransform: 'uppercase', whiteSpace: 'nowrap' }}>{h}</th>
              )}

          <tbody>
            {filtered.length === 0 &&
              <tr><td colSpan={6} style={{ padding: '40px 20px', textAlign: 'center', color: MUTED, fontSize: 14 }}>Nenhum serviço encontrado</td></tr>
            }
            {filtered.map((s) =>
              <tr key={s.id} style={{ borderBottom: `1px solid ${BORDER}88`, transition: 'background 0.15s', background: 'transparent' }}

                <td style={{ padding: '14px 20px', fontWeight: 600, fontSize: 14 }}>{s.empresa}</td>

                      <Icon name="trash" size={13} />

                  </div>
                </td>

            )}

            </Field>

          <Field label="Status">
            <select value={form.status} onChange={(e) => setForm({ ...form, status: e.target.value })} style={selectStyle}

            </select>
          </Field>
          <div style={{ display: 'flex', justifyContent: 'flex-end', gap: 12, marginTop: 8 }}>
            <Btn variant="ghost" onClick={() => setModal(null)}>Cancelar</Btn>
            <Btn onClick={save_} disabled={!form.empresa.trim() || !form.value}>
              <Icon name="check" size={14} /> Salvar
            </Btn>
          </div>
        </Modal>
      }
    </div>
  );
}

      </div>

      {modal &&
        <Modal title={modal === 'new' ? 'Nova Movimentação' : 'Editar Movimentação'} onClose={() => setModal(null)}>
          <Field label="Tipo">
            <div style={{ display: 'flex', gap: 10 }}>
              {['Entrada', 'Saída'].map((t) =>
                <button key={t} onClick={() => setForm({ ...form, type: t })} style={{
                  ...btnBase, flex: 1, justifyContent: 'center', padding: '10px',
                  background: form.type === t ? t === 'Entrada' ? '#4CAF8222' : '#e0505022' : 'transparent',
                  border: `1px solid ${form.type === t ? t === 'Entrada' ? '#4CAF82' : '#e05050' : BORDER}`,
                  color: form.type === t ? t === 'Entrada' ? '#4CAF82' : '#e05050' : MUTED
                }}>
                  <Icon name={t === 'Entrada' ? 'arrow_up' : 'arrow_down'} size={14} color={form.type === t ? t === 'Entrada' ? '#4CAF82' : '#e05050' : MUTED} />
                  {t}
                </button>
              )}
            </div>
          </Field>
          <Field label="Descrição">
            <input value={form.descricao} onChange={(e) => setForm({ ...form, descricao: e.target.value })}
              placeholder="Ex: Pagamento cliente, Aluguel..." style={inputStyle}
              onFocus={(e) => e.target.style.borderColor = WINE}
              onBlur={(e) => e.target.style.borderColor = BORDER} />
          </Field>
          <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 16 }}>
            <Field label="Valor (R$)">
              <input type="number" value={form.value} onChange={(e) => setForm({ ...form, value: e.target.value })}
                placeholder="0,00" style={inputStyle}
                onFocus={(e) => e.target.style.borderColor = WINE}
                onBlur={(e) => e.target.style.borderColor = BORDER} />
            </Field>
            <Field label="Data">
              <input type="date" value={form.date} onChange={(e) => setForm({ ...form, date: e.target.value })}
                style={inputStyle}
                onFocus={(e) => e.target.style.borderColor = WINE}
                onBlur={(e) => e.target.style.borderColor = BORDER} />
            </Field>
          </div>
          <div style={{ display: 'flex', justifyContent: 'flex-end', gap: 12, marginTop: 8 }}>
            <Btn variant="ghost" onClick={() => setModal(null)}>Cancelar</Btn>
            <Btn onClick={save_} disabled={!form.descricao.trim() || !form.value}>
              <Icon name="check" size={14} /> Salvar
            </Btn>
          </div>
        </Modal>
      }
    </div>
  );
}

/* ─── RESPONSIVE HOOK ───────────────────────── */
function useIsMobile() {
  const [mobile, setMobile] = useState(() => window.innerWidth < 768);
  useEffect(() => {
    const fn = () => setMobile(window.innerWidth < 768);
    window.addEventListener('resize', fn);
    return () => window.removeEventListener('resize', fn);
  }, []);
  return mobile;
}

/* ─── HAMBURGER ICON ────────────────────────── */
const HamburgerIcon = ({ open, size = 20, color = 'currentColor' }) => open
  ? <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth="2" strokeLinecap="round"><line x1="18" y1="6" x2="6" y2="18" /><line x1="6" y1="6" x2="18" y2="18" /></svg>
  : <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth="2" strokeLinecap="round"><line x1="3" y1="6" x2="21" y2="6" /><line x1="3" y1="12" x2="21" y2="12" /><line x1="3" y1="18" x2="21" y2="18" /></svg>;

/* ─── COLLAPSE ICON ─────────────────────────── */
const CollapseIcon = ({ collapsed }) =>
<svg width={16} height={16} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round">
  {collapsed
    ? <polyline points="9 18 15 12 9 6" />
    : <polyline points="15 18 9 12 15 6" />}
</svg>;

/* ─── SIDEBAR ───────────────────────────────── */
const NAV = [
  { id: 'dashboard', label: 'Dashboard', icon: 'dashboard' },
  { id: 'services', label: 'Serviços', icon: 'services' },
  { id: 'cash', label: 'Gestão de Caixa', icon: 'cash' }
];

function Sidebar({ active, setActive, onLogout, collapsed, setCollapsed, mobileOpen, setMobileOpen, isMobile, onExport, onImport }) {
  const width = isMobile ? 240 : collapsed ? 64 : 240;

  const handleNav = (id) => {
    setActive(id);
    if (isMobile) setMobileOpen(false);
  };

  return (
    <>
      {/* Mobile overlay backdrop */}
      {isMobile && mobileOpen &&
        <div onClick={() => setMobileOpen(false)} style={{
          position: 'fixed', inset: 0, background: 'rgba(0,0,0,0.7)',
          zIndex: 99, backdropFilter: 'blur(2px)'
        }} />
      }

      <div style={{
        width, minHeight: '100vh', background: '#0D0D0D',
        borderRight: `1px solid ${BORDER}`, display: 'flex',
        flexDirection: 'column',
        position: 'fixed', left: 0, top: 0, bottom: 0, zIndex: 100,
        transform: isMobile ? mobileOpen ? 'translateX(0)' : 'translateX(-100%)' : 'translateX(0)',
        transition: 'width 0.25s ease, transform 0.28s cubic-bezier(0.4,0,0.2,1)',
        overflow: 'hidden'
      }}>
        {/* Logo + collapse toggle */}
        <div style={{
          padding: collapsed && !isMobile ? '28px 0 24px' : '28px 24px 24px',
          borderBottom: `1px solid ${BORDER}`,
          display: 'flex', alignItems: 'center',
          justifyContent: collapsed && !isMobile ? 'center' : 'space-between'
        }}>
          {(!collapsed || isMobile) &&
            <div>
              <div style={{ fontSize: 26, fontWeight: 800, letterSpacing: '-0.02em' }}>
                <span style={{ color: TEXT }}>NODE</span><span style={{ color: WINE }}>X</span>
              </div>
              <div style={{ color: MUTED, letterSpacing: '0.18em', textTransform: 'uppercase', marginTop: 2, fontFamily: 'Arial', fontSize: '7px' }}>AGÊNCIA DE MARKETING DIGITAL</div>
            </div>
          }
          {collapsed && !isMobile &&
            <div style={{ fontSize: 20, fontWeight: 800 }}>
              <span style={{ color: TEXT }}>N</span><span style={{ color: WINE }}>X</span>
            </div>
          }
          {!isMobile &&
            <button onClick={() => setCollapsed(!collapsed)} style={{
              ...btnBase, background: 'transparent', color: MUTED, padding: 6,
              border: `1px solid ${BORDER}`, borderRadius: 7
            }}>
              <CollapseIcon collapsed={collapsed} />
            </button>
          }
          {isMobile &&
            <button onClick={() => setMobileOpen(false)} style={{
              ...btnBase, background: 'transparent', color: MUTED, padding: 6,
              border: `1px solid ${BORDER}`, borderRadius: 7
            }}>
              <HamburgerIcon open={true} size={16} color={MUTED} />
            </button>
          }
        </div>

        {/* Nav */}
        <nav style={{ flex: 1, padding: collapsed && !isMobile ? '16px 8px' : '16px 12px' }}>
          {NAV.map((n) => {
            const isActive = active === n.id;
            return (
              <button key={n.id} onClick={() => handleNav(n.id)} style={{
                ...btnBase, width: '100%',
                justifyContent: collapsed && !isMobile ? 'center' : 'flex-start',
                padding: collapsed && !isMobile ? '12px' : '11px 14px',
                marginBottom: 4, borderRadius: 10, fontSize: 14,
                background: isActive ? `${WINE}22` : 'transparent',
                color: isActive ? TEXT : MUTED,
                border: isActive ? `1px solid ${WINE}44` : '1px solid transparent',
                position: 'relative'
              }} title={collapsed && !isMobile ? n.label : undefined}>
                {isActive && !collapsed &&
                  <div style={{ position: 'absolute', left: 0, top: '20%', bottom: '20%', width: 3, background: WINE, borderRadius: '0 2px 2px 0' }} />
                }
                <Icon name={n.icon} size={16} color={isActive ? WINE : MUTED} />
                {(!collapsed || isMobile) && n.label}
              </button>
            );
          })}
        </nav>

        {/* Backup / Restore */}
        <div style={{ padding: collapsed && !isMobile ? '12px 8px' : '12px 12px', borderTop: `1px solid ${BORDER}` }}>
          {(!collapsed || isMobile) &&
            <div style={{ fontSize: 10, fontWeight: 700, letterSpacing: '0.1em', color: MUTED, textTransform: 'uppercase', marginBottom: 8, paddingLeft: 4 }}>Dados</div>
          }
          <button onClick={onExport} style={{
            ...btnBase, width: '100%',
            justifyContent: collapsed && !isMobile ? 'center' : 'flex-start',
            padding: collapsed && !isMobile ? '10px' : '9px 14px',
            marginBottom: 4, borderRadius: 10, fontSize: 13,
            background: 'transparent', color: MUTED, border: '1px solid transparent'
          }} title="Exportar dados">
            <svg width={15} height={15} viewBox="0 0 24 24" fill="none" stroke={MUTED} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
              <polyline points="7 10 12 15 17 10" />
              <line x1="12" y1="15" x2="12" y2="3" />
            </svg>
            {(!collapsed || isMobile) && 'Exportar dados'}
          </button>
          <label style={{
            display: 'flex', alignItems: 'center', gap: 8,
            width: '100%',
            justifyContent: collapsed && !isMobile ? 'center' : 'flex-start',
            padding: collapsed && !isMobile ? '10px' : '9px 14px',
            borderRadius: 10, fontSize: 13,
            background: 'transparent', color: MUTED,
            cursor: 'pointer', fontFamily: 'Syne, sans-serif', fontWeight: 600,
            letterSpacing: '0.04em', boxSizing: 'border-box'
          }} title="Importar dados">
            <svg width={15} height={15} viewBox="0 0 24 24" fill="none" stroke={MUTED} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
              <polyline points="17 8 12 3 7 8" />
              <line x1="12" y1="3" x2="12" y2="15" />
            </svg>
            {(!collapsed || isMobile) && 'Importar dados'}
            <input type="file" accept=".json" onChange={onImport} style={{ display: 'none' }} />
          </label>
        </div>

        {/* Logout */}
        <div style={{ padding: collapsed && !isMobile ? '16px 8px' : '16px 12px', borderTop: `1px solid ${BORDER}` }}>
          <button onClick={onLogout} style={{
            ...btnBase, width: '100%',
            justifyContent: collapsed && !isMobile ? 'center' : 'flex-start',
            padding: collapsed && !isMobile ? '12px' : '11px 14px',
            background: 'transparent', color: MUTED, border: '1px solid transparent',
            borderRadius: 10, fontSize: 14
          }} title={collapsed && !isMobile ? 'Sair' : undefined}>
            <Icon name="logout" size={16} color={MUTED} />
            {(!collapsed || isMobile) && 'Sair'}
          </button>
        </div>
      </div>
    </>
  );
}

/* ─── APP ───────────────────────────────────── */
function App() {
  const isMobile = useIsMobile();
  const [authed, setAuthed] = useState(() => load('nodex_session', false));
  const [active, setActive] = useState('dashboard');
  const [collapsed, setCollapsed] = useState(false);
  const [mobileOpen, setMobileOpen] = useState(false);

  const [services, setServices_] = useState(() => load('nodex_services', [
    { id: 1, empresa: 'Tech Solutions', descricao: 'Gestão de tráfego pago', value: 3500, status: 'Concluído', date: '2026-01-15' },
    { id: 2, empresa: 'Bella Moda', descricao: 'Social media + criação de conteúdo', value: 3500, status: 'Em andamento', date: '2026-01-15' },
    { id: 3, empresa: 'Construtora Prime', descricao: 'SEO + Google Ads', value: 3500, status: 'Concluído', date: '2026-01-15' },
    { id: 4, empresa: 'Farmácia Popular', descricao: 'Meta Ads', value: 3500, status: 'A fazer', date: '2026-01-15' }
  ]));

  const [cashEntries, setCashEntries_] = useState(() => load('nodex_cash', [
    { id: 1, type: 'Entrada', descricao: 'Recebimento Tech Solutions', value: 3500, date: '2026-01-16' },
    { id: 2, type: 'Entrada', descricao: 'Recebimento Construtora Prime', value: 3500, date: '2026-01-16' },
    { id: 3, type: 'Entrada', descricao: 'Ferramentas SaaS', value: 3500, date: '2026-01-16' },
    { id: 4, type: 'Entrada', descricao: 'Imposto MEI', value: 3500, date: '2026-01-16' }
  ]));

  const setServices = (v) => { setServices_(v); save('nodex_services', v); };
  const setCashEntries = (v) => { setCashEntries_(v); save('nodex_cash', v); };

  const login = () => { save('nodex_session', true); setAuthed(true); };
  const logout = () => { save('nodex_session', false); setAuthed(false); };

  const handleExport = () => {
    const data = { services, cashEntries };
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `nodex-backup-${new Date().toISOString().slice(0, 10)}.json`;
    a.click();
    URL.revokeObjectURL(url);
  };

  const handleImport = (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (ev) => {
      try {
        const data = JSON.parse(ev.target.result);
        if (data.services) setServices(data.services);
        if (data.cashEntries) setCashEntries(data.cashEntries);
      } catch {}
    };
    reader.readAsText(file);
    e.target.value = '';
  };

  const sidebarWidth = isMobile ? 0 : collapsed ? 64 : 240;

  if (!authed) return <Login onLogin={login} />;

  return (
    <div style={{ display: 'flex', minHeight: '100vh' }}>
      <Sidebar
        active={active} setActive={setActive} onLogout={logout}
        collapsed={collapsed} setCollapsed={setCollapsed}
        mobileOpen={mobileOpen} setMobileOpen={setMobileOpen}
        isMobile={isMobile}
        onExport={handleExport}
        onImport={handleImport} />

      {/* Mobile top bar */}
      {isMobile &&
        <div style={{
          position: 'fixed', top: 0, left: 0, right: 0, height: 56, zIndex: 90,
          background: '#0D0D0D', borderBottom: `1px solid ${BORDER}`,
          display: 'flex', alignItems: 'center', padding: '0 16px', gap: 16
        }}>
          <button onClick={() => setMobileOpen(true)} style={{
            ...btnBase, background: 'transparent', color: TEXT, padding: 8,
            border: `1px solid ${BORDER}`, borderRadius: 8
          }}>
            <HamburgerIcon open={false} size={18} color={TEXT} />
          </button>
          <div style={{ fontSize: 20, fontWeight: 800 }}>
            <span style={{ color: TEXT }}>NODE</span><span style={{ color: WINE }}>X</span>
          </div>
        </div>
      }

      <main style={{
        marginLeft: sidebarWidth,
        flex: 1,
        padding: isMobile ? '72px 16px 24px' : '40px 48px',
        minHeight: '100vh',
        background: 'transparent',
        transition: 'margin-left 0.25s ease',
        minWidth: 0
      }}>
        {active === 'dashboard' && <DashboardSection services={services} cashEntries={cashEntries} isMobile={isMobile} />}
        {active === 'services' && <ServicesSection services={services} setServices={setServices} isMobile={isMobile} />}
        {active === 'cash' && <CashSection cashEntries={cashEntries} setCashEntries={setCashEntries} isMobile={isMobile} />}
      </main>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>

</body>
